name: Build locally signed cmux DMG

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CMUX_VERSION: "0.64.22"
  CMUX_COMMIT: "ddd4a01bc5d8ebac19643930f5fd7d40e85f1534"

jobs:
  build:
    name: Build cmux Local on macOS 26
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out the exact official cmux release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: manaflow-ai/cmux
          ref: ddd4a01bc5d8ebac19643930f5fd7d40e85f1534
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Verify pinned source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CMUX_COMMIT"
          git submodule status --recursive

      - name: Show build environment
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          uname -m
          df -h .

      - name: Install cmux build toolchains
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/install-zig-ci.sh
          ./scripts/install-rust-ci.sh

      - name: Prepare GhosttyKit and submodules
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/setup.sh

      - name: Build an isolated locally signed app
        shell: bash
        env:
          CMUX_RELOAD_NO_GLOBAL_CLI_LINKS: "1"
        run: |
          set -euo pipefail
          ./scripts/reload.sh \
            --tag cloud-v06422 \
            --name "cmux Local" \
            --bundle-id "com.cmuxterm.app.local.v06422" \
            --derived-data "$RUNNER_TEMP/cmux-derived" \
            --no-global-cli-links

      - name: Verify and package the local build
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/cmux-derived/Build/Products/Debug/cmux Local.app"
          test -d "$app"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$app"
          /usr/bin/codesign -dv --verbose=4 "$app" 2>&1 | tee "$RUNNER_TEMP/codesign-details.txt"

          mkdir -p "$RUNNER_TEMP/dmg-root"
          /usr/bin/ditto "$app" "$RUNNER_TEMP/dmg-root/cmux Local.app"
          ln -s /Applications "$RUNNER_TEMP/dmg-root/Applications"
          hdiutil create \
            -volname "cmux Local $CMUX_VERSION" \
            -srcfolder "$RUNNER_TEMP/dmg-root" \
            -ov \
            -format UDZO \
            "$RUNNER_TEMP/cmux-local-v$CMUX_VERSION.dmg"

          cd "$RUNNER_TEMP"
          shasum -a 256 "cmux-local-v$CMUX_VERSION.dmg" | tee "cmux-local-v$CMUX_VERSION.sha256"

      - name: Upload DMG and verification records
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-local-v0.64.22-macos-arm64
          path: |
            ${{ runner.temp }}/cmux-local-v0.64.22.dmg
            ${{ runner.temp }}/cmux-local-v0.64.22.sha256
            ${{ runner.temp }}/codesign-details.txt
          if-no-files-found: error
          retention-days: 7
